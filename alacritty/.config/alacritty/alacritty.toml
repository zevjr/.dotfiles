
[colors]
draw_bold_text_with_bright_colors = true

[cursor]
style = "Beam"

[env]
TERM = "xterm-256color"

[font]
size = 14.0

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.offset]
x = 0
y = 1

[terminal.shell]
program = "/usr/bin/tmux"

[window]
decorations = "full"
opacity = 0.8
title = "Alacritty"

[window.class]
general = "Alacritty"
instance = "Alacritty"

[window.padding]
x = 6
y = 2

[general]
live_config_reload = true
import = ["/home/zejr/.dotfiles/alacritty/.config/alacritty/catppuccin/catppuccin-mocha.toml"]

[terminal]
